<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>รีวิว Layout overflow · Run 17</title>
<style>
:root{color-scheme:light;--ink:#183047;--muted:#566d80;--edge:#cbd7df;--blue:#126f9b;--pale:#e9f4fa;--red:#a9312a;--redbg:#fff0ee;--fixed:#fff0ca;--paper:#fff;--back:#f1f5f7}
*{box-sizing:border-box}body{margin:0;background:var(--back);color:var(--ink);font:15px/1.5 'Leelawadee UI',Tahoma,sans-serif}button,input,select,textarea{font:inherit}button,select{cursor:pointer}button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid #ffaf32;outline-offset:2px}
.header{background:#fff;border-bottom:1px solid var(--edge);padding:20px 26px}.header-inner{max-width:1600px;margin:auto}.topline{display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap}h1{font-size:24px;line-height:1.2;margin:0;font-weight:700}.subtitle{color:var(--muted);margin:6px 0 0}.summary{display:flex;gap:12px;flex-wrap:wrap;margin-top:14px}.summary span{padding:5px 10px;border-radius:5px;background:var(--pale);font-size:13px}.summary strong{font-size:17px;color:var(--blue)}.summary .problem{background:var(--redbg)}.summary .problem strong{color:var(--red)}
.app{max-width:1600px;margin:0 auto;display:grid;grid-template-columns:280px minmax(0,1fr);gap:18px;padding:18px 26px}.side{min-width:0;background:var(--paper);border:1px solid var(--edge);border-radius:8px;align-self:start;position:sticky;top:12px}.side-head{padding:14px;border-bottom:1px solid var(--edge)}label{display:block;font-weight:600;font-size:13px;margin-bottom:5px}.search{width:100%;padding:9px 10px;border:1px solid #aebfcb;border-radius:5px;background:white}.side-meta{font-size:12px;color:var(--muted);padding-top:8px}.list{max-height:calc(100vh - 245px);min-height:200px;overflow:auto;padding:5px}.item{width:100%;text-align:left;border:0;border-left:3px solid transparent;background:transparent;padding:9px 10px;display:flex;justify-content:space-between;gap:6px}.item:hover{background:#f2f7fa}.item[aria-current=true]{border-left-color:var(--blue);background:var(--pale);font-weight:700}.item small{color:var(--muted);font-size:12px}.content{min-width:0}.overview{background:var(--paper);border:1px solid var(--edge);border-radius:8px;padding:18px 20px}.case-head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap}.case-head h2{margin:0;font-size:22px}.meta{color:var(--muted);margin:3px 0 0}.pill{background:var(--redbg);color:var(--red);border:1px solid #f1c5bf;border-radius:4px;padding:4px 9px;font-weight:700;font-size:13px}.explain{margin:14px 0 0;color:var(--muted);font-size:13px}.controls{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}.controls button,.export{border:1px solid #aebfcb;border-radius:5px;background:#fff;color:var(--ink);padding:7px 12px}.controls button:hover,.export:hover{background:var(--pale)}
.line{margin-top:14px;background:var(--paper);border:1px solid var(--edge);border-radius:8px;padding:15px 18px}.line.problem{border-left:4px solid #cb4033}.line-head{display:flex;gap:10px;align-items:baseline;flex-wrap:wrap}.line h3{margin:0;font-size:17px}.line .status{font-size:12px;color:var(--red);font-weight:700}.text-pair{display:grid;grid-template-columns:150px minmax(0,1fr);gap:3px 12px;margin:10px 0}.text-pair dt{color:var(--muted);font-size:13px}.text-pair dd{margin:0;white-space:pre-wrap;overflow-wrap:anywhere;font-family:Consolas,'Courier New',monospace}.grid-scroll{overflow:auto;padding-bottom:4px}.mark-grid{display:grid;grid-template-columns:76px repeat(18,minmax(27px,1fr));min-width:570px;gap:2px;align-items:stretch;font:13px/1.2 Consolas,monospace}.mark-grid .label{font:12px/1.2 'Leelawadee UI',Tahoma,sans-serif;align-self:center;color:var(--muted)}.cell{text-align:center;border:1px solid #becfda;min-height:27px;display:grid;place-items:center;background:#fff}.cell.head{border:0;background:transparent;color:var(--muted);min-height:20px;font-size:11px}.cell.blocked{background:#c9e3f0}.cell.fixed{background:var(--fixed);font-weight:700}.cell.diff{box-shadow:inset 0 -3px var(--red)}.no-fit{font-size:13px;color:var(--red);background:var(--redbg);padding:7px 9px;margin-top:8px;border-radius:4px}.legend{display:flex;gap:12px;flex-wrap:wrap;margin-top:8px;font-size:12px;color:var(--muted)}.legend i{display:inline-block;width:12px;height:12px;border:1px solid #a5b9c7;vertical-align:-1px;margin-right:4px}.blocked-key{background:#c9e3f0}.fixed-key{background:var(--fixed)}.free-key{background:#fff}
.bottom{display:grid;grid-template-columns:minmax(0,1fr) minmax(260px,370px);gap:14px;margin-top:14px}.image,.review{background:#fff;border:1px solid var(--edge);border-radius:8px;padding:16px}.image h3,.review h3{margin:0 0 8px;font-size:16px}.image img{display:block;max-width:100%;max-height:480px;object-fit:contain;border:1px solid var(--edge);background:white}.image a{color:var(--blue)}.review select,.review textarea{width:100%;border:1px solid #aebfcb;border-radius:5px;padding:8px;background:#fff}.review textarea{min-height:95px;resize:vertical}.review .help{font-size:12px;color:var(--muted);margin:8px 0 0}.empty{padding:30px;color:var(--muted)}
@media(max-width:900px){.app{grid-template-columns:1fr;padding:12px}.side{position:static}.list{max-height:180px}.bottom{grid-template-columns:1fr}.header{padding:16px}.mark-grid{min-width:570px}}@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important}}
</style>
</head>
<body>
<header class="header"><div class="header-inner"><div class="topline"><h1>รีวิว Layout overflow</h1><button class="export" id="export" type="button">ดาวน์โหลดผลรีวิว CSV</button></div><p class="subtitle">Run 17 · เทียบข้อความ Generator, ช่องใน ACTIVEL และค่า Oracle จาก snapshot</p><div class="summary" id="summary"></div></div></header>
<div class="app"><aside class="side"><div class="side-head"><label for="search">ค้นหา ELR, MARK_ID หรือ ABS</label><input class="search" id="search" type="search" placeholder="เช่น ADI2607 หรือ 20168"><div class="side-meta" id="count" aria-live="polite"></div></div><nav class="list" id="list" aria-label="รายการ ELR"></nav></aside><main class="content" id="content"></main></div>
<script>
const DATA=/*OVERFLOW_DATA*/[];
const RUN_HASH=/*RUN_HASH*/"";
const key='mark-overflow-review-'+RUN_HASH.slice(0,16);let state={};try{state=JSON.parse(localStorage.getItem(key)||'{}')}catch{}
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const options=[['','ยังไม่ตรวจ'],['checked','ตรวจแล้ว'],['layout','ตรวจ Layout'],['generator','ตรวจ Generator'],['drawing','ตรวจ ABS'],['other','ต้องตรวจเพิ่มเติม']];
let filter='', selected=DATA[0]?.elr||'';const list=document.querySelector('#list'),content=document.querySelector('#content');
function filtered(){return DATA.filter(x=>(x.elr+' '+x.mark_id+' '+x.abs).toLowerCase().includes(filter))}
function persist(){try{localStorage.setItem(key,JSON.stringify(state))}catch{}}
function renderList(){const rows=filtered();document.querySelector('#count').textContent=`แสดง ${rows.length} จาก ${DATA.length} ELR`;list.innerHTML=rows.map(x=>`<button class="item" type="button" data-elr="${esc(x.elr)}" aria-current="${x.elr===selected}"><span>${esc(x.elr)}</span><small>${esc(state[x.elr]?.choice?options.find(o=>o[0]===state[x.elr].choice)?.[1]:'ยังไม่ตรวจ')}</small></button>`).join('')||'<p class="empty">ไม่พบรายการ</p>';list.querySelectorAll('button').forEach(b=>b.onclick=()=>{selected=b.dataset.elr;render()})}
function cells(label, values, type, layout){return `<div class="label">${label}</div>`+values.map((v,i)=>{let cls='cell';if(type==='layout')cls+=v===null?'':v===' '?' blocked':' fixed';else if(type==='oracle'&&layout[i]!==null&&String(v??' ')!==String(layout[i]))cls+=' diff';const title='ช่อง '+(i+1)+(type==='layout'?(v===null?' · ใส่ได้':v===' '?' · ช่องเว้น':' · FIX '+v):'');return `<div class="${cls}" title="${esc(title)}">${esc(v===null||v===' '?'·':v)}</div>`}).join('')}
function renderLine(line,recorded){const isErr=line.status==='error',isOriginal=recorded===line.number;const layout=line.layout||Array(18).fill(null), oracle=[...(line.oracle||'').padEnd(18,' ')].slice(0,18);let grid='<div class="label"></div>'+Array.from({length:18},(_,i)=>`<div class="cell head">${i+1}</div>`).join('');grid+=cells('Layout',layout,'layout',layout)+cells('Oracle',oracle,'oracle',layout);if(line.rendered!==null)grid+=cells('ระบบ',[...line.rendered.padEnd(18,' ')].slice(0,18),'system',layout);return `<section class="line ${isErr?'problem':''}"><div class="line-head"><h3>บรรทัด ${line.number}</h3>${isOriginal?'<span class="status">จุดที่ run 17 แจ้ง error</span>':isErr?'<span class="status">พบปัญหาเพิ่มเมื่อตรวจซ้ำ</span>':''}</div><dl class="text-pair"><dt>Generator ก่อนจัด</dt><dd>${esc(line.raw_generated||'(ว่าง)')}</dd><dt>ข้อความที่ส่งจัดช่อง</dt><dd>${esc(line.generated||'(ว่าง)')}</dd><dt>Oracle ใน snapshot</dt><dd>${esc((line.oracle||'').trim()||'(ว่าง)')}</dd></dl><div class="grid-scroll"><div class="mark-grid">${grid}</div></div>${isErr?`<div class="no-fit">จัดวางไม่สำเร็จ: ${esc(line.error)}<br>ระบบไม่ได้ระบุตัวอักษรที่เกินแน่ชัด จึงแสดงข้อความทั้งหมดให้ตรวจเทียบ</div>`:''}</section>`}
function render(){renderList();const r=DATA.find(x=>x.elr===selected);if(!r){content.innerHTML='<div class="empty">เลือกรายการเพื่อดูรายละเอียด</div>';return}const original=Number((r.recorded_error.match(/row (\d+)/)||[])[1]);const image=/^[0-9a-f]{64}\.png$/.test(r.image)?'../cache/images/'+r.image:'';const selectedState=state[r.elr]||{};content.innerHTML=`<section class="overview"><div class="case-head"><div><h2>${esc(r.elr)}</h2><p class="meta">MARK_ID ${esc(r.mark_id)} · ${esc(r.abs||'ไม่พบ ABS')}</p></div><span class="pill">${r.verified?'ตรวจซ้ำตรงกับ run 17':'ตรวจซ้ำไม่ได้'}</span></div><p class="explain">${esc(r.recorded_error)}</p><div class="legend"><span><i class="free-key"></i>ช่องใส่ข้อมูลได้</span><span><i class="blocked-key"></i>ช่องเว้นตาม Layout</span><span><i class="fixed-key"></i>FIX จาก Layout</span><span>เส้นแดงใต้ช่อง = ค่า Oracle ต่างจากช่องสงวน</span></div><p class="explain">Layout และ Oracle เป็นคนละแหล่งข้อมูล ส่วน Generator ด้านล่างสร้างซ้ำจาก engine และ cache ของ run 17; ไม่มีการแก้ไขฐานข้อมูล</p><div class="controls"><button type="button" id="prev">← ก่อนหน้า</button><button type="button" id="next">ถัดไป →</button></div></section>${r.verified?r.lines.map(l=>renderLine(l,original)).join(''):`<section class="line problem"><strong>สร้างข้อมูลซ้ำไม่ได้</strong><p>${esc(r.replay_error)}</p></section>`}<div class="bottom"><section class="image"><h3>ภาพหน้า Brand / Marking</h3>${image?`<a href="${esc(image)}" target="_blank" rel="noopener"><img src="${esc(image)}" alt="ภาพ ABS ${esc(r.abs)}"><small>เปิดภาพขนาดเต็ม</small></a>`:'<p class="empty">ไม่มีภาพใน cache</p>'}</section><section class="review"><h3>บันทึกผลตรวจ</h3><label for="choice">ผลการตรวจ</label><select id="choice">${options.map(([v,t])=>`<option value="${v}" ${selectedState.choice===v?'selected':''}>${t}</option>`).join('')}</select><label for="note" style="margin-top:12px">หมายเหตุ</label><textarea id="note" placeholder="ระบุสาเหตุหรือสิ่งที่ต้องตรวจต่อ">${esc(selectedState.note||'')}</textarea><p class="help">บันทึกเฉพาะในเบราว์เซอร์นี้ ไม่ส่งข้อมูลและไม่แก้ฐานข้อมูล กดดาวน์โหลด CSV เพื่อเก็บหรือส่งต่อ</p></section></div>`;const rows=filtered(),idx=rows.findIndex(x=>x.elr===selected);document.querySelector('#prev').onclick=()=>{if(idx>0){selected=rows[idx-1].elr;render()}};document.querySelector('#next').onclick=()=>{if(idx>=0&&idx<rows.length-1){selected=rows[idx+1].elr;render()}};for(const id of ['choice','note'])document.querySelector('#'+id).addEventListener('input',()=>{state[r.elr]={choice:document.querySelector('#choice').value,note:document.querySelector('#note').value};persist();renderList();renderSummary()})}
function renderSummary(){const verified=DATA.filter(x=>x.verified).length,reviewed=DATA.filter(x=>state[x.elr]?.choice).length;document.querySelector('#summary').innerHTML=`<span>รายการจาก run 17 <strong>${DATA.length}</strong> ELR</span><span>สร้างข้อมูลซ้ำได้ <strong>${verified}</strong></span><span class="problem">ตรวจซ้ำไม่ได้ <strong>${DATA.length-verified}</strong></span><span>บันทึกผลตรวจ <strong>${reviewed}</strong></span>`}
document.querySelector('#search').addEventListener('input',e=>{filter=e.target.value.toLowerCase().trim();renderList()});document.querySelector('#export').onclick=()=>{const quote=v=>'"'+String(v??'').replace(/"/g,'""')+'"';const rows=[['ELR','MARK_ID','ABS','recorded_error','reproduced','review','note'],...DATA.map(x=>[x.elr,x.mark_id,x.abs,x.recorded_error,x.verified?'yes':'no',options.find(o=>o[0]===(state[x.elr]?.choice||''))?.[1],state[x.elr]?.note||''])];const blob=new Blob(['\ufeff'+rows.map(r=>r.map(quote).join(',')).join('\r\n')],{type:'text/csv;charset=utf-8'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='run17-overflow-review.csv';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)};renderSummary();render();
</script>
</body></html>
