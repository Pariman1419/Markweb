limit_req_zone $binary_remote_addr zone=login:10m rate=5r/m;
limit_req_zone $binary_remote_addr zone=files:10m rate=10r/s;
limit_req_zone $binary_remote_addr zone=api:10m rate=20r/s;
limit_req_status 429;

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    client_max_body_size 1m;

    gzip on;
    gzip_min_length 1024;
    gzip_types application/json text/css application/javascript;

    # Static assets fallback
    location / {
        include /etc/nginx/security_headers.conf;
        try_files $uri $uri/ /index.html;
    }

    # Login rate limited zone
    location = /api/auth/login {
        include /etc/nginx/security_headers.conf;
        limit_req zone=login burst=5 nodelay;
        add_header Cache-Control "no-store" always;

        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Request-ID $request_id;
    }

    # Static customer images zone (no no-store header, cacheable)
    location /api/files/ {
        include /etc/nginx/security_headers.conf;
        limit_req zone=files burst=20 nodelay;

        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Request-ID $request_id;
    }

    # General API zone with no-store
    location /api/ {
        include /etc/nginx/security_headers.conf;
        limit_req zone=api burst=40 nodelay;
        add_header Cache-Control "no-store" always;

        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Request-ID $request_id;
    }
}
