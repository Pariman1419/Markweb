services:
  api:
    build:
      context: .
      dockerfile: services/api/Dockerfile
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - ${MARK_FILES_HOST_DIR:-./data/files}:/app/data/files:ro
      - ${MARK_LOG_HOST_DIR:-./logs}:/app/logs
    environment:
      - MARK_FILES_ROOT=/app/data/files
      - MARK_LOG_DIR=/app/logs
      - PYTHONPATH=/app:/app/services/api
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "10"
    expose:
      - "8000"

  web:
    build:
      context: ./web
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "${MARK_WEB_PORT:-80}:80"
    depends_on:
      - api
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "10"
