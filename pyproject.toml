[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "mark_engine"
version = "0.3.0"
description = "Mark verification and expectation engine for ELR packages"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "redis>=5.0.0",
    "pymupdf>=1.24.0",
    "openpyxl>=3.1.0",
    "Pillow>=10.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "hypothesis>=6.0.0",
    "httpx>=0.27,<0.29",
    "tzdata",
]
api = [
    "fastapi>=0.110.0,<0.142",
    "uvicorn[standard]>=0.28.0",
    "psycopg2-binary>=2.9.9",
    "argon2-cffi>=23.1.0",
    "grpcio==1.85.1",
    "grpcio-tools==1.85.1",
    "protobuf==7.36.0",
    "pynvml>=11.5.0",
    "oracledb>=2.0.0",
]

[tool.setuptools.packages.find]
where = [".", "services/api"]
include = ["mark_engine*", "mark_api*"]

[tool.setuptools.package-data]
"mark_engine.rules" = ["data/*.json"]
"mark_engine.encode" = ["data/*.json", "data/*.csv"]

[tool.pytest.ini_options]
pythonpath = [".", "services/api"]
testpaths = ["tests"]
markers = [
    "regression: needs MARK_R0_ROOT",
]
