[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "mark_engine"
version = "0.3.0"
description = "Mark verification and expectation engine for ELR packages"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pymupdf>=1.24.0",
    "openpyxl>=3.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "hypothesis>=6.0.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["mark_engine*"]

[tool.setuptools.package-data]
"mark_engine.rules" = ["data/*.json"]
"mark_engine.encode" = ["data/*.json", "data/*.csv"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
markers = [
    "regression: needs MARK_R0_ROOT",
]
